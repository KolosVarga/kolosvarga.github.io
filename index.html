<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kolos Varga</title>
  <meta name="description" content="Kolos Varga, engineering student. Projects, experience, and resume." />
  <meta property="og:title" content="Kolos Varga" />
  <meta property="og:description" content="Engineering student. Projects, experience, and resume." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#050909" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050909'/%3E%3Cpath d='M32 10 A22 22 0 1 0 50 41 L32 32 Z' fill='%232fbf93'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- GSAP drives the UI motion; Lenis is ready for smooth scrolling once more sections exist -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
</head>
<body>
  <header class="bar" id="bar">
    <a class="mark" href="#top" aria-label="Kolos Varga, home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4 A12 12 0 1 0 26.4 22 L16 16 Z" /></svg>
    </a>
    <nav class="links" aria-label="Primary">
      <!-- Each button sends a ripple into the pond. They'll scroll to sections once those exist. -->
      <button class="link" data-section="about">About</button>
      <button class="link" data-section="projects">Projects</button>
      <button class="link" data-section="experience">Experience</button>
      <button class="link" data-section="contact">Contact</button>
    </nav>
    <!-- EDIT: put your resume at assets/Kolos_Varga_Resume.pdf -->
    <a class="resume" href="assets/Kolos_Varga_Resume.pdf" target="_blank" rel="noopener">Resume</a>
    <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="sheet">Menu</button>
  </header>

  <div class="sheet" id="sheet" hidden>
    <button class="link" data-section="about">About</button>
    <button class="link" data-section="projects">Projects</button>
    <button class="link" data-section="experience">Experience</button>
    <button class="link" data-section="contact">Contact</button>
    <a class="link resume-link" href="assets/Kolos_Varga_Resume.pdf" target="_blank" rel="noopener">Resume</a>
  </div>

  <main class="pond" id="top">
    <h1 class="title" id="title" aria-label="Kolos Varga">Kolos Varga</h1>
    <p class="sr-only">Engineering student, rower, and musician. An illustrated koi pond: click the water to make ripples.</p>
    <canvas id="water" aria-hidden="true"></canvas>
    <canvas id="surface" aria-hidden="true"></canvas>
    <canvas id="pads" aria-hidden="true"></canvas>
    <p class="hint" id="hint"><span class="hint-mouse">Click the water</span><span class="hint-touch">Tap the water</span></p>
  </main>

  <script type="module" src="js/pond.js"></script>
</body>
</html>
